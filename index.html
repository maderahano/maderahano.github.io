    <!-- Apply the stored theme before first paint to avoid a flash. Dark is the default. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
